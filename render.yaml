services:
  - type: web
    name: rpr-gst-demo
    env: python
    buildCommand: pip install -r requirements_demo.txt
    startCommand: gunicorn demo_app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    envVars:
      - key: DEMO_MODE
        value: online
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: gst-demo-storage
      mountPath: /tmp/gst_demo
      sizeGB: 1
